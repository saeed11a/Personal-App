# Base44 sandbox runbook for HIKER+ Shoes Factory ERP.
#
# Runs the Vite dev server straight from the cloned source (bind mount + startup
# install) so every edit shows up live in the preview on host port 3000.
#
# The app is a Base44 frontend: its data/auth backend is a hosted service, so no
# local database service is declared here. Supabase (the target backend) is a
# managed service reached over the network, not a compose service.
#
# `docker compose -f docker-compose.base44.yml up -d --build`
services:
  web:
    # Plain runtime image, never a prebuilt app image: the repo is bind-mounted
    # and the dev server runs from source so edits are live.
    image: node:22-bookworm
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      # Dependencies live in a volume (not the bind mount) and are (re)installed
      # from the mounted manifests on every start, honouring the committed
      # package-lock.json.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this value to `server.allowedHosts`, which is what
      # lets the preview proxy host (<port>-<sandbox id>.e2b.app) reach the dev
      # server. Passed through bare so the platform-provided value is used.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    env_file:
      # Public, non-secret defaults first; platform-managed secrets second, so a
      # value configured in the dashboard always wins over the default.
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000 --strictPort
    # Probes real app responsiveness (index.html served by Vite), with a long
    # grace period for the first dependency install.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # One-shot database tool for the Supabase project. Not started by `up`
  # (profile "tools"); invoke it explicitly, e.g.
  #   docker compose -f docker-compose.base44.yml run --rm dbadmin \
  #     sh -c 'psql "$SUPABASE_DB_URL" -f /sql/migrations/0001_core_schema.sql'
  # Compose parses the managed secrets file (which quotes values containing special
  # characters) correctly, so the connection string arrives intact here.
  dbadmin:
    image: postgres:16
    profiles: ["tools"]
    working_dir: /sql
    volumes:
      - ./supabase:/sql:ro
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

volumes:
  web_node_modules:

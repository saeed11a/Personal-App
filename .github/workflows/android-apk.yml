name: Build HIKER Factory ERP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - App-exe
      # Development branches: builds run here, "main" stays untouched.
      - scratch-supabase-apk-exe
      - personal-oct-11
    paths:
      - "src/**"
      - "public/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  # Also build on pull requests, so a change is verified before it reaches main.
  # Same path filter: a PR that touches none of these files is skipped.
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Set Up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "3. Set Up Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "4. Verify Environment Variables"
        env:
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_BASE44_APP_ID" || (echo "Missing VITE_BASE44_APP_ID" && exit 1)
          test -n "$VITE_BASE44_APP_BASE_URL" || (echo "Missing VITE_BASE44_APP_BASE_URL" && exit 1)
          # Supabase is introduced module by module, so these warn until the
          # migration is complete instead of failing the build today.
          test -n "$VITE_SUPABASE_URL" || echo "::warning::VITE_SUPABASE_URL repository variable is not set"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || echo "::warning::VITE_SUPABASE_PUBLISHABLE_KEY repository variable is not set"

      - name: "5. Install Dependencies"
        run: npm install

      - name: "6. Install Capacitor"
        # One install for every build tool, and the only one: a second
        # `npm install --no-save` later in the job prunes the packages this one
        # added (npm rebuilds the tree from package.json and drops them as
        # extraneous), which breaks `npx cap sync`.
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: "7. Build HIKER ERP"
        run: npm run build -- --base=./
        env:
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: "8. Verify Capacitor Configuration"
        run: |
          test -f capacitor.config.json || (echo "capacitor.config.json is missing" && exit 1)

      - name: "9. Add Android Platform"
        run: npx cap add android

      - name: "10. Generate App Icon"
        # Launcher icon + splash come from the HIKER+ mark in resources/ (see
        # resources/README.md). --assetPath is explicit so the folder cannot be
        # guessed wrong, and the icon background matches the mark's own off-white.
        run: |
          npx @capacitor/assets generate --android --assetPath resources \
            --iconBackgroundColor '#F4F4F4' --iconBackgroundColorDark '#F4F4F4' \
            --splashBackgroundColor '#F4F4F4' --splashBackgroundColorDark '#16191f'

      - name: "11. Sync Android Files"
        run: npx cap sync android

      - name: "12. Build Android APK"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: "13. Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: HIKER-Factory-ERP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
